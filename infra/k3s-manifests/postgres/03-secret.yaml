# 이 파일은 ArgoCD Application 의 directory.exclude 로 sync 에서 제외됨.
# 운영 값으로 채워서 1회만 수동 apply 한다:
#   kubectl --kubeconfig ~/.kube/config-k3s apply -f infra/k3s-manifests/postgres/03-secret.yaml
#
# 실제 비밀값을 git 에 커밋하지 말 것. 아래는 placeholder.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: saju
type: Opaque
stringData:
  POSTGRES_DB: saju
  POSTGRES_USER: saju
  POSTGRES_PASSWORD: CHANGE_ME_IN_PRODUCTION
