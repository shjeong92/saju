# GitOps sync 에서 제외됨 (ArgoCD Application 의 directory.exclude 로 설정).
# 운영 값으로 채워서 1회만 수동 apply:
#   kubectl --kubeconfig ~/.kube/config-k3s apply -f infra/k3s-manifests/api/01-secret.yaml
#
# DATABASE_URL / REDIS_URL 은 namespace 내부 DNS 사용:
#   DATABASE_URL=postgres://saju:<password>@postgres.saju.svc.cluster.local:5432/saju
#   REDIS_URL=redis://redis.saju.svc.cluster.local:6379
apiVersion: v1
kind: Secret
metadata:
  name: api-secret
  namespace: saju
type: Opaque
stringData:
  DATABASE_URL: "postgres://saju:CHANGE_ME_IN_PRODUCTION@postgres.saju.svc.cluster.local:5432/saju"
  REDIS_URL: "redis://redis.saju.svc.cluster.local:6379"
  JWT_SECRET: "CHANGE_ME_AT_LEAST_16_CHARS"
  AI_PROXY_API_KEY: "CHANGE_ME_IN_PRODUCTION"
